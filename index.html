<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mathematic PDF worksheet generator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/pdf-lib"></script>
  </head>

  <body>
    <div style="text-align: center">
      <h1>Mathematic PDF worksheet generator</h1>
    </div>

    <div style="display: flex; justify-content: center">
        <div class="checkboxDiv" style="width: 150px">
            <div class="nrLineDiv">
              <label>
                <input type="checkbox" name="check2" data-value="2" /> 2
              </label>
              <label>
                <input type="checkbox" name="check3" data-value="5" /> 5
              </label>
              <label>
                <input type="checkbox" name="check4" data-value="8" /> 8
              </label>
            </div>
            <div class="nrLineDiv">
              <label>
                <input type="checkbox" name="check5" data-value="3" /> 3
              </label>
              <label>
                <input type="checkbox" name="check6" data-value="6" /> 6
              </label>
              <label>
                <input type="checkbox" name="check7" data-value="9" /> 9
              </label>
            </div>
            <div class="nrLineDiv">
              <label>
                <input type="checkbox" name="check8" data-value="4" /> 4
              </label>
              <label>
                <input type="checkbox" name="check9" data-value="7" /> 7
              </label>
              <label>
                <input type="checkbox" name="check10" data-value="10" /> 10
              </label>
            </div>            
          </div>
          <div>
            <button class="nbrBtn" id="oddBtn">Odd</button> 
            <button class="nbrBtn" id="primeBtn">Prime</button> <br/><br/>
            <button class="nbrBtn" id="evenBtn">Even</button>
        </div>
    </div>
    <div style="display: flex; justify-content: center; margin-top: 10px;">
        <div style="width:236px">
            First: <input type="range" id="numberRange" min="1" max="10" value="1"> 
            <span id="numberRangeSpan" style="margin-left: 20px;">1</span>
        </div>
    </div>

    <div style="display: flex; justify-content: center; margin-top:20px">
        <div style="display: flex; flex-direction: column;">
            <label style="margin-bottom: 10px;">Number of questions:
                <input
                type="number"
                id="quantity"
                class="numberInput"
                required
                min="6"
                max="40"
                placeholder="12"
              />
            </label>

            <div class="operationsDiv" style="display: flex; flex-direction: column; margin-top: 20px;">
                <div style="display: flex; justify-content: space-between;">
                    <label>Addition: </label>
                    <input type="checkbox" name="add" data-value="add" />
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <label>Subtraction: </label>
                    <input type="checkbox" name="sub" data-value="sub"/>                    
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <label>Multiplication:</label>
                    <input type="checkbox" name="mult" data-value="mul" />
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <label>Division:</label>
                    <input type="checkbox" name="div" data-value="div" />
                </div>
            </div>
        </div>
    </div>

    <div class="generateBtn">
      <button
        type="button"
        name="pdf"
        onclick="generatePDF()"
        style="margin-left: 20px"
      >
        Export PDF
      </button>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
